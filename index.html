<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MONS CITY GTA - V5</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;overflow:hidden}
body{background:#1a1a1a}
canvas{display:block;background:#2d4a22}
#hud{position:absolute;top:0;left:0;right:0;height:70px;background:linear-gradient(#111,#000);border-bottom:3px solid #ffcc00;display:flex;align-items:center;justify-content:space-between;padding:0 15px;color:white;z-index:10}
#hud b{color:#ffcc00}
#controls{position:absolute;bottom:15px;left:15px;background:rgba(0,0,0,0.85);color:white;padding:12px;border-radius:12px;font-size:13px;line-height:1.6;z-index:10;border:2px solid #333}
#controls kbd{background:#333;padding:2px 6px;border-radius:4px;border:1px solid #555}
#action{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:#ffcc00;color:black;padding:10px 22px;border-radius:30px;font-weight:900;font-size:16px;display:none;z-index:10;animation:pulse 0.8s infinite}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.05}}
#minimap{position:absolute;top:85px;right:15px;width:160px;height:160px;background:rgba(0,0,0,0.9);border:3px solid #fff;border-radius:10px;z-index:10}
</style>
</head>
<body>
<div id="hud">
<div>💰 <b id="cash">500€</b> | ⭐ <b id="wanted">0</b> | ❤️ <b id="health">100</b></div>
<div>MONS <b style="color:#ff2222">GTA</b></div>
<div id="speed">0 KM/H</div>
</div>
<canvas id="minimap"></canvas>
<div id="controls">
<kbd>ZQSD</kbd> = Marcher / Conduire<br>
<kbd>E</kbd> = Voler voiture / Sortir<br>
<kbd>SHIFT</kbd> = Courir
</div>
<div id="action">APPUYE SUR E</div>
<canvas id="game"></canvas>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const mini=document.getElementById('minimap');
const mctx=mini.getContext('2d');
let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;mini.width=160;mini.height=160;}
window.addEventListener('resize',resize);resize();
const world={w:3000,h:2000};
const player={x:1500,y:1000,w:22,h:22,speed:3.2,runSpeed:5.5,angle:0,inCar:null,health:100};
const keys={};
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true; if(e.key.toLowerCase()=='e') tryEnterExit();});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const buildings=[
{x:200,y:200,w:300,h:180,color:'#8d6e63',label:'GARAGE'},
{x:700,y:200,w:350,h:200,color:'#78909c',label:'MAISONS'},
{x:1300,y:150,w:400,h:250,color:'#1e3a8a',label:'POLICE'},
{x:200,y:600,w:300,h:180,color:'#a1887f',label:'SUPERETTE'},
{x:700,y:550,w:400,h:280,color:'#4e342e',label:'HOTEL DE VILLE'},
{x:1300,y:600,w:350,h:220,color:'#6d4c41',label:'MAISONS'},
{x:200,y:1100,w:350,h:250,color:'#ff6f00',label:'LIDL'},
{x:700,y:1100,w:400,h:350,color:'#5d4037',label:'CITE'},
{x:1300,y:1100,w:400,h:350,color:'#b71c1c',label:'HOPITAL'},
{x:2000,y:200,w:400,h:1600,color:'#2e7d32',label:'PARC'},
];
const roads=[
{x:0,y:480,w:3000,h:80},
{x:0,y:1000,w:3000,h:80},
{x:600,y:0,w:80,h:2000},
{x:1200,y:0,w:80,h:2000},
];
const cars=[
{x:320,y:450,color:'#ff2222',w:50,h:24,angle:0,speed:0,parked:true},
{x:850,y:900,color:'#ffeb3b',w:50,h:24,angle:0,speed:0,parked:true,isTaxi:true},
{x:1450,y:480,color:'#2196f3',w:50,h:24,angle:0,speed:0,parked:true},
{x:350,y:1250,color:'#212121',w:50,h:24,angle:0,speed:0,parked:true},
{x:1550,y:1400,color:'#e91e63',w:50,h:24,angle:0,speed:0,parked:true},
{x:600,y:1500,color:'#4caf50',w:50,h:24,angle:0.5,speed:0,parked:true},
];
let cash=500; let wanted=0; let camera={x:0,y:0};
function tryEnterExit(){
 if(player.inCar){
   let c=player.inCar; player.inCar=null; player.x=c.x+60; player.y=c.y; c.parked=false; document.getElementById('action').style.display='none'; return;
 }
 for(let car of cars){
   let dx=player.x-car.x, dy=player.y-car.y;
   if(Math.hypot(dx,dy)<70){ player.inCar=car; car.parked=false; if(!car.isTaxi){wanted=Math.min(5,wanted+1); cash+=20;} updateHUD(); document.getElementById('action').style.display='none'; return; }
 }
}
function updateHUD(){ document.getElementById('cash').textContent=cash+'€'; document.getElementById('wanted').textContent='★'.repeat(wanted)||'0'; document.getElementById('health').textContent=player.health; }
function checkCollision(x,y){ for(let b of buildings){ if(x+11>b.x && x-11<b.x+b.w && y+11>b.y && y-11<b.y+b.h) return true; } return x<0||y<0||x>world.w||y>world.h; }
function update(){
 let running=keys['shift'];
 if(player.inCar){
   let car=player.inCar; let accel=0;
   if(keys['z']||keys['w']||keys['arrowup']) accel=0.35;
   if(keys['s']||keys['arrowdown']) accel=-0.22;
   if(keys['q']||keys['a']||keys['arrowleft']) car.angle-=0.06*Math.abs(car.speed/4+0.5);
   if(keys['d']||keys['arrowright']) car.angle+=0.06*Math.abs(car.speed/4+0.5);
   car.speed+=accel; car.speed*=0.97; car.speed=Math.max(-5,Math.min(9,car.speed));
   let nx=car.x+Math.cos(car.angle)*car.speed; let ny=car.y+Math.sin(car.angle)*car.speed;
   if(!checkCollision(nx,ny)){car.x=nx;car.y=ny;} else car.speed*=-0.5;
   player.x=car.x; player.y=car.y; document.getElementById('speed').textContent=Math.abs(Math.round(car.speed*18))+' KM/H';
 } else {
   let spd= running?player.runSpeed:player.speed; let nx=player.x, ny=player.y;
   if(keys['z']||keys['w']||keys['arrowup']) ny-=spd; if(keys['s']||keys['arrowdown']) ny+=spd; if(keys['q']||keys['a']||keys['arrowleft']) nx-=spd; if(keys['d']||keys['arrowright']) nx+=spd;
   if(!checkCollision(nx,player.y)) player.x=nx; if(!checkCollision(player.x,ny)) player.y=ny;
   document.getElementById('speed').textContent=running?'COURS!':'A PIED';
   let near=false; for(let car of cars){ if(Math.hypot(player.x-car.x,player.y-car.y)<70) near=true; }
   document.getElementById('action').style.display=near?'block':'none';
 }
 camera.x=player.x-W/2; camera.y=player.y-H/2; camera.x=Math.max(0,Math.min(world.w-W,camera.x)); camera.y=Math.max(0,Math.min(world.h-H,camera.y));
}
function drawWorld(){
 ctx.fillStyle='#3a6b2f'; ctx.fillRect(-camera.x,-camera.y,world.w,world.h);
 ctx.fillStyle='#3a3a3a'; for(let r of roads){ ctx.fillRect(r.x-camera.x,r.y-camera.y,r.w,r.h); }
 for(let b of buildings){
   ctx.fillStyle=b.color; ctx.fillRect(b.x-camera.x,b.y-camera.y,b.w,b.h);
   ctx.fillStyle='white'; ctx.font='bold 14px sans-serif'; ctx.fillText(b.label,b.x-camera.x+10,b.y-camera.y+25);
 }
 for(let car of cars){
   ctx.save(); ctx.translate(car.x-camera.x,car.y-camera.y); ctx.rotate(car.angle);
   ctx.fillStyle=car.color; ctx.fillRect(-car.w/2,-car.h/2,car.w,car.h);
   ctx.fillStyle='#111'; ctx.fillRect(-car.w/2+5,-car.h/2-2,10,6); ctx.fillRect(car.w/2-15,-car.h/2-2,10,6);
   ctx.fillStyle='rgba(135,206,235,0.8)'; ctx.fillRect(-car.w/2+10,-car.h/2+2,car.w-20,car.h-4);
   if(car.isTaxi){ ctx.fillStyle='#ffcc00'; ctx.font='bold 9px sans-serif'; ctx.fillText('TAXI',-14,3); }
   ctx.restore();
 }
 if(!player.inCar){
   ctx.save(); ctx.translate(player.x-camera.x,player.y-camera.y);
   ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath();ctx.ellipse(0,12,14,6,0,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#1565c0'; ctx.fillRect(-8,-8,16,18);
   ctx.fillStyle='#ffcc99'; ctx.beginPath();ctx.arc(0,-14,10,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#111'; ctx.fillRect(-10,-20,20,6);
   let t=Date.now()/120; let leg=(Math.sin(t)*6); let moving=keys['z']||keys['s']||keys['q']||keys['d']||keys['w']||keys['a'];
   ctx.fillStyle='#222'; ctx.fillRect(-7,10,6,12+(moving?leg:0)); ctx.fillRect(1,10,6,12-(moving?leg:0));
   ctx.restore();
 }
}
function drawMini(){
 mctx.fillStyle='#1a3a1a'; mctx.fillRect(0,0,160,160); let sx=160/world.w, sy=160/world.h;
 mctx.fillStyle='#444'; for(let r of roads) mctx.fillRect(r.x*sx,r.y*sy,r.w*sx,r.h*sy);
 for(let b of buildings){ mctx.fillStyle='#666'; mctx.fillRect(b.x*sx,b.y*sy,b.w*sx,b.h*sy);}
 for(let c of cars){ mctx.fillStyle=c.color; mctx.fillRect(c.x*sx-2,c.y*sy-2,4,4);}
 mctx.fillStyle='#ffcc00'; mctx.beginPath(); mctx.arc(player.x*sx,player.y*sy,5,0,Math.PI*2); mctx.fill();
}
function loop(){ update(); drawWorld(); drawMini(); requestAnimationFrame(loop); }
loop(); updateHUD();
let touchStart=null;
canvas.addEventListener('touchstart',e=>{touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};});
canvas.addEventListener('touchmove',e=>{
 if(!touchStart) return; let dx=e.touches[0].clientX-touchStart.x; let dy=e.touches[0].clientY-touchStart.y;
 keys['d']=dx>20; keys['q']=dx<-20; keys['s']=dy>20; keys['z']=dy<-20;
});
canvas.addEventListener('touchend',()=>{touchStart=null;keys['z']=keys['q']=keys['s']=keys['d']=false;});
</script>
</body>
</html>
