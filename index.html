<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MONS GTA V7 MOBILE 3D</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Russo+One&display=swap');
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
body{background:#000;font-family:'Russo One',sans-serif;overflow:hidden}
#canvas{width:100vw;height:100vh;display:block}
#hud{position:absolute;top:0;left:0;right:0;height:52px;background:#000;border-bottom:4px solid #ffcc00;display:flex;justify-content:space-between;align-items:center;padding:0 12px;color:#fff;z-index:20;font-size:13px}
#hud b{color:#ffcc00}
#msg{position:absolute;top:62px;left:50%;transform:translateX(-50%);background:#ffcc00;color:#000;padding:8px 18px;border-radius:999px;font-size:14px;font-weight:900;display:none;z-index:20;box-shadow:0 0 15px #ffcc00}
#minimap{position:absolute;top:62px;right:8px;width:120px;height:120px;border:2px solid #fff;border-radius:10px;overflow:hidden;z-index:20;background:#000}
#joystick{position:absolute;bottom:18px;left:18px;width:130px;height:130px;z-index:20}
#joyBase{position:absolute;width:130px;height:130px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);border-radius:50%;backdrop-filter:blur(4px)}
#joyStick{position:absolute;left:40px;top:40px;width:50px;height:50px;background:rgba(255,204,0,.9);border-radius:50%;box-shadow:0 0 15px #ffcc00}
#camZone{position:absolute;right:0;top:0;bottom:0;width:55%;z-index:15}
#btns{position:absolute;bottom:18px;right:18px;display:flex;flex-direction:column;gap:10px;z-index:20}
.btn{width:64px;height:64px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fff;background:rgba(0,0,0,.55);backdrop-filter:blur(6px)}
.btn:active{background:#ffcc00;color:#000;transform:scale(0.9)}
#btnEnter{background:rgba(255,204,0,.9);color:#000;border-color:#ffcc00;width:78px;height:78px;font-size:12px;text-align:center;line-height:1.1}
#btnRun{position:absolute;bottom:160px;left:170px;width:56px;height:56px;z-index:20;font-size:12px}
#loading{position:absolute;inset:0;background:#000;color:#ffcc00;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:99;gap:14px;font-size:20px}
.bar{width:260px;height:8px;background:#222;border-radius:10px;overflow:hidden}.fill{height:100%;width:0%;background:#ffcc00;transition:width.2s}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="loading"><div>MONS GTA 3D MOBILE</div><div class="bar"><div class="fill" id="fill"></div></div><div id="perc" style="font-size:12px;color:#fff">0%</div></div>
<div id="hud"><div>💶 <b>2.500€</b> ⭐ <b>★★</b></div><div>MONS <span style="color:#ff2222">GTA</span> MOBILE 3D</div><div id="speed">0 KM/H</div></div>
<div id="msg">VOLER</div>
<canvas id="minimap"></canvas>
<div id="camZone"></div>
<div id="joystick"><div id="joyBase"></div><div id="joyStick"></div></div>
<div id="btns">
<button class="btn" id="btnEnter">E<br>VOITURE</button>
<button class="btn" id="btnJump">⬆️</button>
<button class="btn" id="btnCam">👁️</button>
</div>
<button class="btn" id="btnRun">🏃</button>
<canvas id="canvas"></canvas>
<script type="module">
import * as THREE from 'three';
const fill=document.getElementById('fill'), perc=document.getElementById('perc');
function setLoad(p){fill.style.width=p+'%';perc.textContent=p+'%'; if(p>=100) setTimeout(()=>document.getElementById('loading').style.display='none',300)}
setLoad(15);
const canvas=document.getElementById('canvas');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true;
const scene=new THREE.Scene(); scene.fog=new THREE.Fog(0x87ceeb, 300, 1800); scene.background=new THREE.Color(0x87ceeb);
const camera=new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 2500);
setLoad(35);
scene.add(new THREE.AmbientLight(0xffffff,0.75));
const sun=new THREE.DirectionalLight(0xffffff,1.1); sun.position.set(300,500,200); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024); scene.add(sun);
const worldW=4000, worldH=4000;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(worldW,worldH), new THREE.MeshStandardMaterial({color:0x2d5a27})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
function addRoad(x,z,w,h){ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshStandardMaterial({color:0x2e2e2e})); m.rotation.x=-Math.PI/2; m.position.set(x+ w/2 - worldW/2,0.15,z+ h/2 - worldH/2); scene.add(m); }
for(let x=0;x<worldW;x+=500) addRoad(x,0,80,worldH);
for(let z=0;z<worldH;z+=500) addRoad(0,z,worldW,80);
setLoad(60);
const buildingData=[]; const colors=[0xc9b896,0x8aa8c8,0xd8c4a6,0xb83a3a,0xb9b9b9,0x6d4c41,0xff7a18];
function addBuilding(x,z,w,d,h,c){ const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({color:c})); b.position.set(x- worldW/2 + w/2, h/2, z- worldH/2 + d/2); b.castShadow=true; scene.add(b); buildingData.push({x:b.position.x,z:b.position.z,w,d}); }
for(let gx=200;gx<worldW-200;gx+=500){
 for(let gz=200;gz<worldH-200;gz+=500){
  if(gx%1000==200 && gz%1000==200) continue;
  if(Math.random()>0.4){ addBuilding(gx+30,gz+30,120+Math.random()*90,120+Math.random()*90,50+Math.random()*140, colors[Math.floor(Math.random()*colors.length)]); }
 }
}
addBuilding(worldW/2-200,worldH/2-200,400,300,240,0xe8d5b5);
addBuilding(worldW/2+300,worldH/2-200,180,180,340,0x8aa8c8);
setLoad(80);
const cars=[];
function addCar(x,z,col){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(38,16,20), new THREE.MeshStandardMaterial({color:col})); body.position.y=12; body.castShadow=true; g.add(body);
 const roof=new THREE.Mesh(new THREE.BoxGeometry(22,10,18), new THREE.MeshStandardMaterial({color:0x111})); roof.position.y=21; g.add(roof);
 g.position.set(x- worldW/2,0,z- worldH/2); g.rotation.y=Math.random()*6.28; scene.add(g);
 cars.push({mesh:g,speed:0,angle:g.rotation.y});
}
for(let i=0;i<30;i++) addCar(200+Math.random()*3600, Math.random()>0.5?0xff2222:0xffec00);
setLoad(92);
const player={x:0,y:20,z:0,vy:0,onGround:true,inCar:null};
const pGroup=new THREE.Group(); const pb=new THREE.Mesh(new THREE.BoxGeometry(9,16,5), new THREE.MeshStandardMaterial({color:0x0d47a1})); pb.position.y=13; pGroup.add(pb); const ph=new THREE.Mesh(new THREE.SphereGeometry(5,10,10), new THREE.MeshStandardMaterial({color:0xffcc99})); ph.position.y=25; pGroup.add(ph); scene.add(pGroup);
let joyX=0,joyY=0, isRunning=false, camYaw=0, camPitch=-0.2, camDist=110, third=true;
const joyBase=document.getElementById('joystick'); const joyStick=document.getElementById('joyStick');
function handleJoy(e){
 const rect=joyBase.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; const cx=rect.left+65, cy=rect.top+65;
 let dx=t.clientX-cx, dy=t.clientY-cy; let dist=Math.hypot(dx,dy); if(dist>45){ dx=dx/dist*45; dy=dy/dist*45; }
 joyStick.style.transform=`translate(${dx}px,${dy}px)`; joyX=dx/45; joyY=dy/45;
}
function resetJoy(){ joyStick.style.transform='translate(0,0)'; joyX=0; joyY=0; }
joyBase.addEventListener('touchstart',handleJoy); joyBase.addEventListener('touchmove',handleJoy); joyBase.addEventListener('touchend',resetJoy);
const camZone=document.getElementById('camZone'); let lastTx=0,lastTy=0;
camZone.addEventListener('touchstart',e=>{lastTx=e.touches[0].clientX; lastTy=e.touches[0].clientY;});
camZone.addEventListener('touchmove',e=>{ let dx=e.touches[0].clientX-lastTx, dy=e.touches[0].clientY-lastTy; camYaw-=dx*0.006; camPitch-=dy*0.006; camPitch=Math.max(-1.0,Math.min(0.6,camPitch)); lastTx=e.touches[0].clientX; lastTy=e.touches[0].clientY; });
document.getElementById('btnJump').addEventListener('touchstart',e=>{e.preventDefault(); if(player.onGround &&!player.inCar){ player.vy=8; player.onGround=false; }});
document.getElementById('btnCam').addEventListener('touchstart',e=>{e.preventDefault(); third=!third; if(!third) camDist=0; else camDist=110;});
document.getElementById('btnRun').addEventListener('touchstart',e=>{e.preventDefault(); isRunning=true;}); document.getElementById('btnRun').addEventListener('touchend',()=>isRunning=false);
function tryEnter(){
 if(player.inCar){ player.inCar=null; pGroup.visible=true; player.x+=50; return; }
 for(let c of cars){ if(Math.hypot(player.x-c.mesh.position.x, player.z-c.mesh.position.z)<55){ player.inCar=c; pGroup.visible=false; return; } }
}
document.getElementById('btnEnter').addEventListener('touchstart',e=>{e.preventDefault(); tryEnter();});
function update(){
 if(player.inCar){
  let c=player.inCar; let acc=0; if(joyY<-0.2) acc=0.5; if(joyY>0.2) acc=-0.3;
  if(joyX<-0.2) c.angle+=0.06; if(joyX>0.2) c.angle-=0.06;
  c.speed+=acc; c.speed*=0.96; c.speed=Math.max(-4,Math.min(10,c.speed));
  c.mesh.rotation.y=c.angle; c.mesh.position.x+=Math.sin(c.angle)*c.speed; c.mesh.position.z+=Math.cos(c.angle)*c.speed;
  player.x=c.mesh.position.x; player.z=c.mesh.position.z;
  document.getElementById('speed').textContent=Math.abs(Math.round(c.speed*15))+' KM/H';
 }else{
  let sp=isRunning?3.8:1.9; let fwd=new THREE.Vector3(Math.sin(camYaw),0,Math.cos(camYaw)); let right=new THREE.Vector3(Math.sin(camYaw+Math.PI/2),0,Math.cos(camYaw+Math.PI/2));
  let move=new THREE.Vector3(); move.addScaledVector(fwd, -joyY*sp); move.addScaledVector(right, joyX*sp);
  player.vy-=0.55; player.y+=player.vy; if(player.y<=20){player.y=20; player.vy=0; player.onGround=true;}
  let nx=player.x+move.x, nz=player.z+move.z; let coll=false; for(let b of buildingData){ if(Math.abs(nx-b.x)<b.w/2+7 && Math.abs(nz-b.z)<b.d/2+7){coll=true; break;}}
  if(!coll){ player.x=nx; player.z=nz; }
  pGroup.position.set(player.x,player.y,player.z); pGroup.rotation.y=camYaw;
  document.getElementById('speed').textContent=isRunning?'SPRINT':'MARCHE';
  let near=false; for(let c of cars) if(Math.hypot(player.x-c.mesh.position.x, player.z-c.mesh.position.z)<60) near=true;
  document.getElementById('msg').style.display=near?'block':'none';
 }
 if(player.inCar){
  let c=player.inCar; let tx=c.mesh.position.x, tz=c.mesh.position.z;
  let cx=tx - Math.sin(c.angle)*camDist, cz=tz - Math.cos(c.angle)*camDist;
  camera.position.lerp(new THREE.Vector3(cx,60,cz),0.15); camera.lookAt(tx,12,tz);
 }else{
  if(third){ let cx=player.x - Math.sin(camYaw)*camDist, cz=player.z - Math.cos(camYaw)*camDist, cy=player.y+35+Math.sin(camPitch)*25;
   camera.position.lerp(new THREE.Vector3(cx,cy,cz),0.18); camera.lookAt(player.x,player.y+12,player.z);
  }else{ camera.position.set(player.x,player.y+24,player.z); camera.rotation.order='YXZ'; camera.rotation.y=camYaw; camera.rotation.x=camPitch; }
 }
}
const mini=document.getElementById('minimap'); const mCtx=mini.getContext('2d'); mini.width=120; mini.height=120;
function drawMini(){ mCtx.fillStyle='#102510'; mCtx.fillRect(0,0,120,120); let sx=120/worldW; mCtx.fillStyle='#333'; for(let i=0;i<worldW;i+=500){ mCtx.fillRect(i*sx,0,80*sx,120); } for(let j=0;j<worldH;j+=500){ mCtx.fillRect(0,j*sx,120,80*sx); } for(let c of cars){ mCtx.fillStyle='#f00'; mCtx.fillRect((c.mesh.position.x+worldW/2)*sx,(c.mesh.position.z+worldW/2)*sx,2,2);} mCtx.fillStyle='#ffcc00'; mCtx.beginPath(); mCtx.arc((player.x+worldW/2)*sx,(player.z+worldW/2)*sx,4,0,6.28); mCtx.fill(); }
setLoad(100);
function loop(){ requestAnimationFrame(loop); update(); drawMini(); renderer.render(scene,camera); } loop();
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();});
</script>
</body>
</html>
