<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MONS GTA V6 - REALISTIC</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Russo+One&display=swap');
*{margin:0;padding:0;box-sizing:border-box;overflow:hidden}
body{background:#0a0a0a;font-family:'Russo One',sans-serif}
canvas{display:block}
#hud{position:absolute;top:0;left:0;right:0;height:56px;background:#000;border-bottom:4px solid #ffcc00;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#fff;z-index:20}
#hud-left{display:flex;gap:18px;align-items:center}
.badge{background:#111;border:2px solid #333;border-radius:8px;padding:4px 10px;font-size:13px}
.badge b{color:#ffcc00}
#speedo{font-size:22px;color:#ffcc00;letter-spacing:1px}
#action{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);background:#ffcc00;color:#000;padding:12px 28px;border-radius:999px;font-weight:900;font-size:18px;display:none;z-index:20;box-shadow:0 0 25px #ffcc00;animation:pop .5s infinite alternate}
@keyframes pop{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.08)}}
#controls{position:absolute;bottom:14px;left:14px;background:rgba(0,0,0,.85);color:#bbb;padding:10px 14px;border-radius:12px;font-size:12px;line-height:1.5;z-index:20;border:1px solid #333}
#minimapWrap{position:absolute;top:70px;right:14px;width:190px;height:190px;background:#000;border:3px solid #fff;border-radius:12px;overflow:hidden;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.8)}
#minimap{width:100%;height:100%}
#title{letter-spacing:3px}
#title span{color:#ff2222}
</style>
</head>
<body>
<div id="hud">
<div id="hud-left">
<div class="badge">💶 <b id="cash">1.250€</b></div>
<div class="badge">⭐ <b id="wanted">★★</b></div>
<div class="badge">❤️ <b id="health">100</b></div>
</div>
<div id="title">MONS <span>GTA</span> V6</div>
<div id="speedo">0 KM/H</div>
</div>
<div id="minimapWrap"><canvas id="minimap"></canvas></div>
<div id="controls">ZQSD / Flèches = Bouger<br>E = Voler / Sortir<br>SHIFT = Courir | ESPACE = Frein à main</div>
<div id="action">E - VOLER LA VOITURE</div>
<canvas id="game"></canvas>
<script>
const C=document.getElementById('game'), X=C.getContext('2d');
const MC=document.getElementById('minimap'), MX=MC.getContext('2d');
let W,H; function RS(){W=C.width=innerWidth;H=C.height=innerHeight;MC.width=190;MC.height=190} addEventListener('resize',RS); RS();
const world={w:4000,h:3000};
const player={x:2000,y:1500,speed:3.4,run:5.8,inCar:null};
const keys={}; let camera={x:0,y:0};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true; if(e.key.toLowerCase()=='e') tryEnter(); if(e.code=='Space') keys[' ']=true});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false; if(e.code=='Space') keys[' ']=false});
function rnd(a,b){return a+Math.random()*(b-a)}
const buildings=[
 {x:400,y:300,w:420,h:300,color:'#c9b896',roof:'#a89a7a',label:'GARE DE MONS',type:'station'},
 {x:1100,y:280,w:380,h:280,color:'#8aa8c8',roof:'#6b8ab0',label:'POLICE MONS',type:'police'},
 {x:1750,y:250,w:500,h:320,color:'#d8c4a6',roof:'#b8a082',label:'GRAND PLACE',type:'mairie'},
 {x:2500,y:300,w:420,h:300,color:'#9fb29c',roof:'#7f9a7c',label:'BEFFROI',type:'tower'},
 {x:3200,y:280,w:380,h:480,color:'#c1a085',roof:'#a07a5a',label:'MANUFACTURE',type:'indus'},
 {x:380,y:850,w:420,h:280,color:'#ff7a18',roof:'#cc5e10',label:'LIDL',type:'shop'},
 {x:1050,y:820,w:420,h:320,color:'#e0d6c3',roof:'#c2b6a0',label:'MAISONS',type:'house'},
 {x:1720,y:800,w:520,h:380,color:'#b83a3a',roof:'#8e2222',label:'HOPITAL',type:'hospital'},
 {x:2500,y:830,w:450,h:350,color:'#b9b9b9',roof:'#8a8a8a',label:'CITE DU SOLEIL',type:'cite'},
 {x:3200,y:900,w:400,h:320,color:'#6d4c41',roof:'#4e342e',label:'IKEA',type:'shop'},
 {x:380,y:1450,w:400,h:300,color:'#8d6e63',roof:'#5d4037',label:'GARAGE TUNING',type:'garage'},
 {x:1050,y:1450,w:500,h:400,color:'#a0a0a0',roof:'#777',label:'GHETTO NORD',type:'cite'},
 {x:1750,y:1480,w:460,h:380,color:'#d7c9a8',roof:'#b5a47e',label:'EGLISE ST NICOLAS',type:'church'},
 {x:2500,y:1450,w:480,h:420,color:'#7a9a7a',roof:'#5a7a5a',label:'PARC DU WANGLOT',type:'park',isPark:true},
 {x:3200,y:1450,w:420,h:500,color:'#3a3a3a',roof:'#222',label:'USINE',type:'indus'},
 {x:380,y:2100,w:500,h:350,color:'#c2b280',roof:'#a08e60',label:'MAISONS DORTOIR',type:'house'},
 {x:1100,y:2100,w:800,h:350,color:'#8aa08a',roof:'#6a7a6a',label:'STADE MONS',type:'stade'},
 {x:2100,y:2100,w:500,h:400,color:'#b0b0b0',roof:'#888',label:'QUARTIER ROUGE',type:'house'},
 {x:2800,y:2100,w:700,h:400,color:'#5a5a5a',roof:'#333',label:'ZONE INDUS',type:'indus'},
];
const roads=[
 {x:0,y:650,w:4000,h:110}, {x:0,y:1280,w:4000,h:110}, {x:0,y:1940,w:4000,h:110},
 {x:900,y:0,w:110,h:3000}, {x:1600,y:0,w:110,h:3000}, {x:2350,y:0,w:110,h:3000}, {x:3050,y:0,w:110,h:3000},
];
const cars=[
 {x:600,y:620,color:'#ff1a1a',w:64,h:28,angle:0,speed:0,model:'sport'},
 {x:1250,y:600,color:'#ffec1a',w:62,h:27,angle:0.1,speed:0,model:'taxi',isTaxi:true},
 {x:1900,y:610,color:'#0a84ff',w:66,h:29,angle:-0.05,speed:0,model:'sedan'},
 {x:2600,y:600,color:'#111',w:70,h:30,angle:0,speed:0,model:'suv'},
 {x:3400,y:620,color:'#ff2d95',w:60,h:26,angle:0,speed:0,model:'sport'},
 {x:500,y:1240,color:'#2ecc71',w:62,h:28,angle:0,speed:0,model:'sedan'},
 {x:1200,y:1260,color:'#ffffff',w:68,h:30,angle:0,speed:0,model:'police',isPolice:true},
 {x:2000,y:1250,color:'#ff8c00',w:64,h:28,angle:0.2,speed:0,model:'sport'},
 {x:2750,y:1230,color:'#8e44ad',w:62,h:27,angle:0,speed:0,model:'sedan'},
 {x:3350,y:1250,color:'#00d2ff',w:60,h:26,angle:0,speed:0,model:'sport'},
 {x:600,y:1880,color:'#c0392b',w:72,h:32,angle:0,speed:0,model:'truck'},
 {x:1800,y:1900,color:'#f1c40f',w:62,h:27,angle:0,speed:0,model:'taxi',isTaxi:true},
 {x:2600,y:1890,color:'#2c3e50',w:66,h:29,angle:0,speed:0,model:'suv'},
 {x:3300,y:1900,color:'#e74c3c',w:60,h:26,angle:-0.1,speed:0,model:'sport'},
];
let particles=[]; let cash=1250, wanted=2;
function tryEnter(){
 if(player.inCar){let c=player.inCar; player.inCar=null; player.x=c.x+70; player.y=c.y; return;}
 for(let car of cars){ if(Math.hypot(player.x-car.x,player.y-car.y)<80){ player.inCar=car; if(!car.isTaxi && !car.isPolice){wanted=Math.min(5,wanted+1); cash+=50; updateHUD();} if(car.isTaxi) wanted=0; document.getElementById('action').style.display='none'; return; } }
}
function updateHUD(){document.getElementById('cash').textContent=cash+'€'; document.getElementById('wanted').textContent='★'.repeat(wanted)||'0';}
function collide(x,y){ for(let b of buildings){ if(b.isPark) continue; if(x+14>b.x && x-14<b.x+b.w && y+14>b.y && y-14<b.y+b.h) return true; } return x<0||y<0||x>world.w||y>world.h; }
function update(){
 let run=keys['shift'];
 if(player.inCar){
  let c=player.inCar; let acc=0;
  if(keys['z']||keys['w']||keys['arrowup']) acc=0.42;
  if(keys['s']||keys['arrowdown']) acc=-0.28;
  if(keys['q']||keys['a']||keys['arrowleft']) c.angle-=0.07*Math.abs(c.speed/3+0.6);
  if(keys['d']||keys['arrowright']) c.angle+=0.07*Math.abs(c.speed/3+0.6);
  if(keys[' ']){ c.speed*=0.88; if(Math.abs(c.speed)>2){ particles.push({x:c.x, y:c.y, vx:rnd(-2,2), vy:rnd(-2,2), life:20, color:'#888'}); } }
  c.speed+=acc; c.speed*=0.985; c.speed=Math.max(-6,Math.min(11,c.speed));
  let nx=c.x+Math.cos(c.angle)*c.speed, ny=c.y+Math.sin(c.angle)*c.speed;
  if(!collide(nx,ny)){c.x=nx;c.y=ny;} else {c.speed*=-0.4; particles.push({x:c.x,y:c.y,vx:rnd(-3,3),vy:rnd(-3,3),life:15,color:'#ffcc00'});}
  player.x=c.x; player.y=c.y;
  document.getElementById('speedo').textContent=Math.abs(Math.round(c.speed*19))+' KM/H';
 }else{
  let sp=run?player.run:player.speed; let nx=player.x, ny=player.y;
  if(keys['z']||keys['w']||keys['arrowup']) ny-=sp; if(keys['s']||keys['arrowdown']) ny+=sp;
  if(keys['q']||keys['a']||keys['arrowleft']) nx-=sp; if(keys['d']||keys['arrowright']) nx+=sp;
  if(!collide(nx,player.y)) player.x=nx; if(!collide(player.x,ny)) player.y=ny;
  document.getElementById('speedo').textContent=run?'SPRINT':'A PIED';
  let near=false; for(let car of cars) if(Math.hypot(player.x-car.x,player.y-car.y)<80) near=true;
  document.getElementById('action').style.display=near?'block':'none';
 }
 camera.x=player.x-W/2; camera.y=player.y-H/2;
 camera.x=Math.max(0,Math.min(world.w-W,camera.x)); camera.y=Math.max(0,Math.min(world.h-H,camera.y));
 particles=particles.filter(p=>p.life>0); for(let p of particles){p.x+=p.vx; p.y+=p.vy; p.life--; p.vx*=0.9; p.vy*=0.9;}
}
function draw(){
 X.fillStyle='#2e7d32'; X.fillRect(-camera.x,-camera.y,world.w,world.h);
 X.fillStyle='rgba(0,0,0,.07)'; for(let i=0;i<4000;i+=80){ X.fillRect(i-camera.x,0,1,world.h); } for(let j=0;j<3000;j+=80){ X.fillRect(-camera.x,j-camera.y,world.w,1); }
 for(let r of roads){
  X.fillStyle='#1a1a1a'; X.fillRect(r.x-camera.x+6, r.y-camera.y+6, r.w, r.h);
  X.fillStyle='#3b3b3b'; X.fillRect(r.x-camera.x, r.y-camera.y, r.w, r.h);
  X.fillStyle='#2a2a2a'; X.fillRect(r.x-camera.x, r.y-camera.y, r.w, 8); X.fillRect(r.x-camera.x, r.y-camera.y+r.h-8, r.w, 8);
  X.fillStyle='#e6e6c8'; X.setLineDash([28,22]); X.lineWidth=3;
  if(r.w> r.h){ X.beginPath(); X.moveTo(r.x-camera.x, r.y-camera.y+r.h/2); X.lineTo(r.x-camera.x+r.w, r.y-camera.y+r.h/2); X.stroke(); }
  else { X.beginPath(); X.moveTo(r.x-camera.x+r.w/2, r.y-camera.y); X.lineTo(r.x-camera.x+r.w/2, r.y-camera.y+r.h); X.stroke(); }
  X.setLineDash([]);
 }
 for(let b of buildings){
  let bx=b.x-camera.x, by=b.y-camera.y;
  if(bx> W+200 || by> H+200 || bx+b.w< -200 || by+b.h< -200) continue;
  X.fillStyle='rgba(0,0,0,.45)'; X.fillRect(bx+12,by+12,b.w,b.h);
  X.fillStyle=b.color; X.fillRect(bx,by,b.w,b.h);
  X.fillStyle='rgba(0,0,0,.08)'; for(let i=0;i<b.w;i+=22){ X.fillRect(bx+i,by,1,b.h); } for(let j=0;j<b.h;j+=14){ X.fillRect(bx,by+j,b.w,1); }
  X.fillStyle=b.roof; X.fillRect(bx,by,b.w,b.h*0.18);
  X.fillStyle='rgba(0,0,0,.25)'; X.fillRect(bx,by,b.w,6);
  if(!b.isPark){
   X.fillStyle='#1a2a3a'; for(let fy=by+b.h*0.25; fy<by+b.h-10; fy+=28){ for(let fx=bx+12; fx<bx+b.w-12; fx+=26){ if(Math.random()>0.15){ X.fillStyle=Math.random()>0.7?'#ffe9a8':'#2a3a4a'; X.fillRect(fx,fy,14,16); X.fillStyle='rgba(255,255,255,.3)'; X.fillRect(fx,fy,14,2); } } }
  }else{
   for(let k=0;k<18;k++){ let ax=bx+rnd(20,b.w-20), ay=by+rnd(20,b.h-20); X.fillStyle='#3e2723'; X.fillRect(ax-3,ay-3,6,10); X.fillStyle='#2e7d32'; X.beginPath(); X.arc(ax,ay-6, rnd(10,18),0,Math.PI*2); X.fill(); }
  }
  X.fillStyle='#fff'; X.font='900 11px Russo One'; X.fillText(b.label, bx+8, by+14);
 }
 for(let c of cars){
  let cx=c.x-camera.x, cy=c.y-camera.y; if(cx< -100||cx> W+100||cy< -100||cy> H+100) continue;
  X.save(); X.translate(cx,cy); X.rotate(c.angle);
  X.fillStyle='rgba(0,0,0,.5)'; X.fillRect(-c.w/2+6, -c.h/2+8, c.w, c.h);
  X.fillStyle=c.color; 
  X.beginPath(); X.roundRect(-c.w/2, -c.h/2, c.w, c.h, 7); X.fill();
  X.fillStyle='rgba(120,190,255,.9)'; X.fillRect(-c.w/2+14, -c.h/2+3, c.w-28, c.h-6);
  X.fillStyle='#fffde7'; X.fillRect(c.w/2-2, -c.h/2+4, 4,6); X.fillRect(c.w/2-2, c.h/2-10, 4,6);
  if(c.speed< -0.5 || keys[' ']){ X.fillStyle='#ff0000'; X.fillRect(-c.w/2-1, -c.h/2+3,3,6); X.fillRect(-c.w/2-1, c.h/2-9,3,6); }
  if(c.isTaxi){ X.fillStyle='#000'; X.font='bold 8px sans-serif'; X.fillText('TAXI', -12,3); }
  if(c.isPolice){ X.fillStyle='#fff'; X.font='bold 7px sans-serif'; X.fillText('POLICE', -16,3); }
  X.restore();
 }
 for(let p of particles){ X.fillStyle=p.color; X.globalAlpha=p.life/20; X.fillRect(p.x-camera.x, p.y-camera.y,4,4); X.globalAlpha=1; }
 if(!player.inCar){
  let px=player.x-camera.x, py=player.y-camera.y;
  X.save(); X.translate(px,py);
  X.fillStyle='rgba(0,0,0,.4)'; X.beginPath(); X.ellipse(0,16,16,7,0,0,Math.PI*2); X.fill();
  X.fillStyle='#0d47a1'; X.fillRect(-10,-10,20,22);
  X.fillStyle='#111'; X.fillRect(-11,10,9,14); X.fillRect(2,10,9,14);
  X.fillStyle='#ffcc99'; X.beginPath(); X.arc(0,-16,11,0,Math.PI*2); X.fill();
  X.fillStyle='#000'; X.fillRect(-12,-24,24,8); X.fillStyle='#ffcc00'; X.fillRect(-12,-24,24,3);
  X.restore();
 }
}
function drawMini(){
 MX.fillStyle='#102510'; MX.fillRect(0,0,190,190);
 let sx=190/world.w, sy=190/world.h;
 MX.fillStyle='#333'; for(let r of roads) MX.fillRect(r.x*sx,r.y*sy,r.w*sx,r.h*sy);
 for(let b of buildings){ MX.fillStyle=b.isPark?'#2e7d32':'#777'; MX.fillRect(b.x*sx,b.y*sy,b.w*sx,b.h*sy); }
 for(let c of cars){ MX.fillStyle=c.color; MX.fillRect(c.x*sx-2,c.y*sy-2,4,4); }
 MX.fillStyle='#ffcc00'; MX.beginPath(); MX.arc(player.x*sx,player.y*sy,6,0,Math.PI*2); MX.fill(); MX.strokeStyle='#fff'; MX.lineWidth=2; MX.stroke();
}
function loop(){ update(); draw(); drawMini(); requestAnimationFrame(loop); }
loop(); updateHUD();
</script>
</body>
</html>
